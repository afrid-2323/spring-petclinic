name: Docker Workflow

on:
  workflow_dispatch:
    inputs:
      dockerimage:
        description: "Docker image name"
        required: true
        default: "spring"

      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: true
        default: "afriid"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Application
        run: ./mvnw clean package -DskipTests

      - name: setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.event.inputs.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ github.event.inputs.DOCKERHUB_USERNAME }}/${{ github.event.inputs.dockerimage }}:${{ github.run_id }}
            ${{ github.event.inputs.DOCKERHUB_USERNAME }}/${{ github.event.inputs.dockerimage }}-snapshot:${{ github.run_id }}
